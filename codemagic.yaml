workflows:
  ios-unsigned:
    name: BYPASS7 TEXTURAS iOS 2.1 build 2 (unsigned)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Check Xcode project
        script: |
          set -euo pipefail
          SOURCE_DIR="$CM_BUILD_DIR"
          xcodebuild -list -project "$SOURCE_DIR/ThreeOneOSFive.xcodeproj"
      - name: Build unsigned BYPASS7 TEXTURAS app
        script: |
          set -o pipefail
          SOURCE_DIR="$CM_BUILD_DIR"
          mkdir -p "$CM_BUILD_DIR/build/DerivedData/Build/Products/Release-iphoneos"
          xcodebuild \
            -project "$SOURCE_DIR/ThreeOneOSFive.xcodeproj" \
            -target "3105" \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="$CM_BUILD_DIR/build/DerivedData/Build/Products/Release-iphoneos" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee "$CM_BUILD_DIR/build/xcodebuild.log"
      - name: Verify metadata and package IPA
        script: |
          set -euo pipefail
          APP_PATH="$CM_BUILD_DIR/build/DerivedData/Build/Products/Release-iphoneos/3105.app"
          test -d "$APP_PATH"
          test -f "$APP_PATH/Info.plist"
          ! find "$APP_PATH" -type f \( -name '*.mfp' -o -name '*.3105' \) | grep -q .
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PATH/Info.plist" | grep -qx '2.1'
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP_PATH/Info.plist" | grep -qx '2'
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist" | grep -qx 'com.apple.mobile.MobileHouseArrest'
          IPA_DIR="$CM_BUILD_DIR/build/ipa"
          mkdir -p "$IPA_DIR/Payload"
          ditto "$APP_PATH" "$IPA_DIR/Payload/3105.app"
          (cd "$IPA_DIR" && /usr/bin/zip -qry "$IPA_DIR/BYPASS7-TEXTURAS.ipa" Payload)
    artifacts:
      - build/ipa/BYPASS7-TEXTURAS.ipa
      - build/xcodebuild.log
